[pytest]
# Configurações do pytest para o projeto SmartOCR Finance

# Diretórios de teste
testpaths = tests

# Caminho Python para imports
pythonpath = src app

# Opções padrão do pytest
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=src
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=70

# Marcadores personalizados
markers =
    slow: Testes que são lentos e podem ser skipados em CI/CD
    integration: Testes de integração que requerem dependências externas
    requires_postgres: Testes que requerem PostgreSQL
    unit: Testes unitários isolados
    e2e: Testes end-to-end

# Configurações de cobertura
[coverage:run]
source = src,app
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */venv/*
    */env/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov